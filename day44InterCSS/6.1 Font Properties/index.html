<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Properties</title>
  <style>
    body {
      background-color: cornflowerblue;
      color: white;
      font-size: 18px;
    }

    /* Don't change the CSS above, add Your CSS below */
    #Color {
     color: coral;
    }

    #em {
      font-size: 2rem;
    }

    #fw {
      font-weight: 900;
    }

    #ff {
      font-family: 'Caveat', cursive;
      font-weight: 400;
    }

    #ta {
      text-align: right;

    }
    html {
     font-size: 30px;
    }

    
  </style>
</head>

<body>
  <h1>Important CSS Properties</h1>
  <p id="Color">Color</p>
  <p id="em">Font Size</p>
  <p id="fw">Font Weight</p>
  <p id="ff">Font Family</p>
  <p id="ta">Text Align</p>

</html>
